name: Android build
# Every push builds a debug APK you can install directly (Actions → run → Artifacts).
# When the Play signing secrets exist, it also builds the release .aab for the Play Console.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "builds/**"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: android
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Write app config
        run: |
          cat > www/js/config.js <<CFG
          window.FRENZO_CONFIG = { supabaseUrl: "${{ secrets.SUPABASE_URL }}", supabaseAnonKey: "${{ secrets.SUPABASE_ANON_KEY }}", aiParsing: ${{ vars.AI_PARSING || 'false' }}, readOnly: ${{ vars.APP_READ_ONLY || 'true' }} };
          CFG
      - run: npm run build && npx cap sync android
      - name: Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: frenzo-ledger-debug.apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Keep the latest APK in the repository (easy phone download)
        run: |
          mkdir -p builds && cp android/app/build/outputs/apk/debug/app-debug.apk builds/frenzo-ledger.apk
          git config user.name "frenzo-bot" && git config user.email "bot@frenzo.local"
          git pull --rebase -q origin main || true
          git add builds/frenzo-ledger.apk
          git diff --cached --quiet || git commit -m "build: Android APK $(date -u +%F)" && git push
      - name: Release AAB (signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { name: frenzo-ledger-release.aab, path: android/app/build/outputs/bundle/release/app-release.aab }
