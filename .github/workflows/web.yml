name: Web app (GitHub Pages)
# Publishes the app as a website you can "Add to Home Screen" on any phone — no app store needed.
# Turn on once: repository Settings → Pages → Source: GitHub Actions. The address will be
# https://<your-github-name>.github.io/frenzo-ledger/
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Write app config
        run: |
          cat > www/js/config.js <<CFG
          window.FRENZO_CONFIG = { supabaseUrl: "${{ secrets.SUPABASE_URL }}", supabaseAnonKey: "${{ secrets.SUPABASE_ANON_KEY }}", aiParsing: ${{ vars.AI_PARSING || 'false' }} };
          CFG
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
